name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Published npm version (leave latest for the newest release)'
        default: latest
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Exact npm version published by the release workflow'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci
        working-directory: ./docs

      - name: Resolve documentation version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${REQUESTED_VERSION:-$(node -p "require('./package.json').version")}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install the published package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in {1..10}; do
            if npm install --no-save --package-lock=false --prefer-online "chinese-days@$RELEASE_VERSION"; then
              INSTALLED_VERSION=$(node -p "require('chinese-days/package.json').version")
              if [ "$RELEASE_VERSION" = latest ] || [ "$INSTALLED_VERSION" = "$RELEASE_VERSION" ]; then
                exit 0
              fi
            fi
            if [ "$attempt" -eq 10 ]; then
              echo 'Published package is still unavailable after retries.' >&2
              exit 1
            fi
            echo 'Waiting 30 seconds for npm registry propagation...'
            sleep 30
          done
        working-directory: ./docs

      - name: Build documentation
        run: npm run build
        working-directory: ./docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/.vitepress/dist
          cname: chinese-days.yaavi.me
