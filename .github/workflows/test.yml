name: Run Tests

on:
  pull_request: # 监听 Pull Request 事件
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check automation scripts
        run: npm run check:scripts

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify npm package contents without publishing
        run: npm pack --dry-run
